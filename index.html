<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Prototipi web BEGAMEC">
  <title>Prototipi | BEGAMEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #df19e8; --violet: #9b42ea; --black: #08080a; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--black);
      font-family: Inter, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(223,25,232,.16), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(155,66,234,.14), transparent 30%),
        #f7f7f8;
    }
    main { width: min(900px, 100%); text-align: center; }
    .logo {
      width: 210px;
      height: 120px;
      object-fit: cover;
      display: block;
      margin: 0 auto 30px;
      border-radius: 4px;
      box-shadow: 0 12px 35px rgba(0,0,0,.12);
    }
    h1 {
      margin: 0;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: .9;
      text-transform: uppercase;
      letter-spacing: -.03em;
      background: linear-gradient(110deg, var(--brand), var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { margin: 22px auto 0; color: #666; font-size: 1rem; }
    .prototypes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 28px;
      margin-top: 55px;
    }
    .prototype {
      width: clamp(130px, 24vw, 170px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 5px solid var(--black);
      border-radius: 50%;
      background: var(--black);
      color: white;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(4rem, 10vw, 6rem);
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .prototype:hover, .prototype:focus-visible {
      transform: translateY(-8px) scale(1.03);
      background: var(--brand);
      color: white;
      border-color: var(--brand);
      box-shadow: 0 22px 45px rgba(223,25,232,.28);
      outline: none;
    }
    .prototype:focus-visible { outline: 4px solid rgba(155,66,234,.35); outline-offset: 6px; }
    @media (max-width: 480px) {
      body { padding-block: 24px; }
      .logo { width: 180px; height: 104px; margin-bottom: 25px; }
      .prototypes { margin-top: 42px; }
    }
  </style>
</head>
<body>
  <main>

    <h1>Prototipi</h1>
    <p class="subtitle">Seleziona un numero per visualizzare il relativo prototipo.</p>

    <div class="prototypes" aria-label="Elenco prototipi disponibili">
      <a class="prototype" href="./site_1.html" target="_blank" rel="noopener" aria-label="Apri il prototipo 1">1</a>
    </div>
  </main>
</body>
</html>
